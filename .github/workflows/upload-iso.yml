name: Upload ISO to Pi

on:
  push:
    branches:
      - main
    paths:
      - 'isos/*.iso'
      - '.github/workflows/upload-iso.yml'

jobs:
  upload-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Find newest ISO
        id: find_iso
        run: |
          set -euo pipefail

          ISO_DIR="isos"
          ISO_PATTERN='^deanos-([0-9]{2})-([0-9]{2})-([0-9]{4})-([0-9]+)_([0-9]+)\.iso$'

          if [ ! -d "$ISO_DIR" ]; then
            echo "Missing folder: $ISO_DIR" >&2
            exit 1
          fi

          newest_key=""
          newest_file=""

          for filepath in "$ISO_DIR"/*.iso; do
            [ -e "$filepath" ] || continue
            filename="$(basename "$filepath")"

            if [[ "$filename" =~ $ISO_PATTERN ]]; then
              dd="${BASH_REMATCH[1]}"
              mm="${BASH_REMATCH[2]}"
              yyyy="${BASH_REMATCH[3]}"
              major="${BASH_REMATCH[4]}"
              minor="${BASH_REMATCH[5]}"

              # Compare by semantic version first, then by date.
              key="$(printf '%010d%010d%04d%02d%02d' "$((10#$major))" "$((10#$minor))" "$((10#$yyyy))" "$((10#$mm))" "$((10#$dd))")"
              if [ -z "$newest_key" ] || [ "$key" \> "$newest_key" ]; then
                newest_key="$key"
                newest_file="$filepath"
              fi
            fi
          done

          if [ -z "$newest_file" ]; then
            echo "No ISO files found matching deanos-DD-MM-YYYY-X_Y_Z.iso" >&2
            exit 1
          fi

          echo "newest_file=$newest_file" >> "$GITHUB_OUTPUT"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Upload newest ISO to Pi
        env:
          PI_HOST: 100.122.138.106
          PI_USER: pie
          PI_DEST: /home/pie/adelahmad.dev/deanos/iso
          NEWEST_FILE: ${{ steps.find_iso.outputs.newest_file }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "$PI_HOST" >> ~/.ssh/known_hosts
          scp -o StrictHostKeyChecking=yes "$NEWEST_FILE" "$PI_USER@$PI_HOST:$PI_DEST/"
          echo "Uploaded $(basename "$NEWEST_FILE") to $PI_HOST:$PI_DEST"
